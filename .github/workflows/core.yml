name: Core

# The Rust core and the native apps over it (docs/CORE.md).
on:
  pull_request:
    paths: ['core/**', 'apps/**', 'Config/Ivy.xcconfig', 'SignalServiceKit/Protos/Specifications/**', '.github/workflows/core.yml']
  push:
    paths: ['core/**', 'apps/**', '.github/workflows/core.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsqlcipher-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - working-directory: core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  mac:
    name: Core tests and Mac app build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: brew install xcodegen protobuf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Bundled SQLCipher on CommonCrypto, as the apps ship it.
      - name: Core tests
        working-directory: core
        run: cargo test
      # Not behind TLS interception like a development sandbox, so the pinned connection can be tried.
      - name: Provisioning socket on Signal's server
        working-directory: core
        run: cargo test -- --ignored live
      - name: Build the Mac app
        working-directory: apps/mac
        run: |
          xcodegen generate
          xcodebuild -project IvyMac.xcodeproj -scheme Ivy -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build
