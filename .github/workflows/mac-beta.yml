name: Mac beta

# Builds the Mac beta (signed ad hoc, see docs/MAC_BETA.md). Every push to
# main publishes it as a pre-release; pull requests that change the beta
# build, and manual runs on other branches, only build it and keep the zip
# as a workflow artifact.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/mac-beta.yml
      - Scripts/ivy/mac-beta.sh
      - Scripts/ivy/IvyMacBeta.entitlements
      - SignalServiceKit/Ivy/IvyMacBeta.swift
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  build:
    name: Build the Mac beta
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Select Xcode
        run: echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/org.signal.libsignal
            ~/Library/Caches/org.signal.ringrtc
          key: deps-${{ hashFiles('Podfile.lock', 'Scripts/ivy/catalyst-dependencies.json') }}

      - name: Cache build products
        uses: actions/cache@v4
        with:
          path: ~/IvyBetaDerivedData
          key: beta-derived-data-${{ github.sha }}
          restore-keys: |
            beta-derived-data-

      - name: Install dependencies
        run: make dependencies
        env:
          # For release downloads through the API when a link fails.
          GH_TOKEN: ${{ github.token }}

      - name: Build
        env:
          # Only released betas know their number and update themselves.
          IVY_MAC_BETA_NUMBER: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_number || '' }}
        run: Scripts/ivy/mac-beta.sh build/mac-beta

      - name: Keep the build
        uses: actions/upload-artifact@v6
        with:
          name: Ivy-Mac-Beta
          path: build/mac-beta

      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: mac-beta-logs
          path: ~/Library/Logs/Ivy-CI

      # Only main is released; manual runs on other branches are test builds.
      - name: Publish the pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mac-beta-${{ github.run_number }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # The pull requests merged since the last beta, for the updater's
          # "what's new". Each pull request's merge commit has the PR title on
          # its second line; other merges (main into a branch) are skipped.
          PREVIOUS=$(gh api "repos/${{ github.repository }}/releases?per_page=20" \
            --jq '[.[] | select(.tag_name | startswith("mac-beta-"))][0].target_commitish // empty' || true)
          CHANGES=""
          if [ -n "$PREVIOUS" ]; then
            CHANGES=$(gh api "repos/${{ github.repository }}/compare/${PREVIOUS}...${{ github.sha }}" \
              --jq '.commits[] | select(.parents | length > 1) | .commit.message | select(startswith("Merge pull request")) | split("\n") | map(select(length > 0)) | .[1] // empty' \
              | head -n 15 | sed 's/^/- /' || true)
          fi
          if [ -n "$CHANGES" ]; then
            CHANGES=$(printf 'Changes:\n%s\n' "$CHANGES")
          fi
          cat > notes.md <<NOTES
          Mac beta built from ${SHORT_SHA}. Signed ad hoc, without a developer certificate.

          ${CHANGES}

          How to install and update: see [docs/MAC_BETA.md](https://github.com/${{ github.repository }}/blob/main/docs/MAC_BETA.md).

          SHA-256: $(cut -d' ' -f1 build/mac-beta/Ivy-Mac-Beta.zip.sha256)
          NOTES
          gh release create "$TAG" build/mac-beta/Ivy-Mac-Beta.zip \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Ivy Mac beta ${{ github.run_number }}" \
            --notes-file notes.md
