name: TestFlight

# Builds the iOS app, signs it with a certificate made for the run and
# uploads it to TestFlight. Run it by hand from the Actions tab. Setup and
# the secrets it needs: docs/TESTFLIGHT.md. The steps live in
# .github/actions/testflight.
#
# Where it builds:
#   auto       GitHub's free Macs. When none is free, GitHub gives up after
#              15 minutes and the build moves to a paid Namespace Mac
#              (profile namespace-profile-ivy-macos, billed per minute).
#   github     GitHub's free Macs only.
#   namespace  A Namespace Mac right away.
# Only people who can push to the repository can start it.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to build
        type: choice
        default: auto
        options:
          - auto
          - github
          - namespace

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_KEY: ${{ secrets.ASC_KEY }}
  IVY_BUILD: ${{ github.run_number }}
  IVY_PUSH_RELAY_HOST: ${{ vars.IVY_PUSH_RELAY_HOST }}

jobs:
  github:
    name: Build and upload to TestFlight
    if: inputs.runner != 'namespace'
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      started: ${{ steps.started.outputs.started }}
    steps:
      # Lets the Namespace job tell "no Mac was free" from a failed build.
      - id: started
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/testflight

  namespace:
    name: Build and upload to TestFlight (Namespace)
    needs: github
    # Runs when asked for, or in auto mode when GitHub had no Mac: the job
    # then ends as cancelled without having started. A run cancelled by hand
    # does not fall back.
    if: >-
      !cancelled() && (inputs.runner == 'namespace' ||
      (inputs.runner == 'auto' && needs.github.result == 'cancelled' && needs.github.outputs.started != 'true'))
    runs-on: namespace-profile-ivy-macos
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/testflight
