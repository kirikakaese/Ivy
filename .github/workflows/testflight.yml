name: TestFlight

# Builds the iOS app, signs it with a certificate made for the run and
# uploads it to TestFlight. Run it by hand from the Actions tab. Setup and
# the secrets it needs: docs/TESTFLIGHT.md.
#
# The build runs on GitHub's free Macs, or, when those are all taken, on a
# paid Namespace Mac (profile namespace-profile-ivy-macos, billed per
# minute). Only people who can push to the repository can start it.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to build
        type: choice
        default: github
        options:
          - github
          - namespace

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  upload:
    name: Build and upload to TestFlight
    runs-on: ${{ inputs.runner == 'namespace' && 'namespace-profile-ivy-macos' || 'macos-26' }}
    timeout-minutes: 180
    steps:
      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/TESTFLIGHT.md)"
            exit 1
          fi

      - name: Select Xcode
        # GitHub's and Namespace's Macs keep Xcode 26.6 under different names.
        run: |
          app="$XCODE_APP"
          if [ ! -d "$app" ]; then
            app=$(ls -d /Applications/Xcode*26.6*.app 2>/dev/null | head -n 1)
          fi
          if [ -z "$app" ] || [ ! -d "$app" ]; then
            echo "::error::Xcode 26.6 not found. Installed:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Using $app"
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check the API key and the app record
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          IVY_BUNDLE_ID: io.github.kirikakaese.ivy
        run: ruby Scripts/ivy/asc-check.rb

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/org.signal.libsignal
            ~/Library/Caches/org.signal.ringrtc
          key: deps-${{ hashFiles('Podfile.lock') }}

      - name: Install dependencies
        run: make dependencies

      - name: Build, sign and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          IVY_BUILD: ${{ github.run_number }}
          IVY_PUSH_RELAY_HOST: ${{ vars.IVY_PUSH_RELAY_HOST }}
        run: Scripts/ivy/testflight.sh

      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: testflight-logs
          path: ~/Library/Logs/Ivy-CI
