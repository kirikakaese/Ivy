name: CI

# Draft pull requests get a fast check: both apps and all test bundles are
# built. Pull requests that are ready for review, pushes to main and manual
# runs also run the full test suite.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Test Ivy scripts
        run: python3 -m unittest discover -s Scripts/ivy -p 'test_*.py' -v

      - name: Check app name rules against upstream strings
        run: python3 Scripts/ivy/app_name.py check Scripts/ivy/app-name-rules.json Signal/translations

      - name: Check Ivy's own strings
        run: python3 Scripts/ivy/ivy_strings.py check

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/gateway/go.mod

      - name: Test the push relay gateway
        working-directory: relay/gateway
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - name: Build the push relay gateway image
        run: docker build relay/gateway

  relay-mollysocket:
    name: Patched MollySocket
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build MollySocket with Ivy's patch
        run: docker build relay/mollysocket

  build:
    name: ${{ matrix.name }} build and test
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            name: iOS
          - platform: macos
            name: macOS
    steps:
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show environment
        run: |
          xcodebuild -version
          sw_vers
          df -h /
          sysctl -n hw.ncpu hw.memsize

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Choose test mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "MODE=fast" >> "$GITHUB_ENV"
          else
            echo "MODE=full" >> "$GITHUB_ENV"
          fi

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/org.signal.libsignal
            ~/Library/Caches/org.signal.ringrtc
          key: deps-${{ hashFiles('Podfile.lock') }}

      # Build products from another runner image (another macOS version)
      # are rebuilt anyway, so each image keeps its own cache. GitHub rolls
      # out new images over several days, with both versions in use.
      - name: Note the runner image
        run: echo "RUNNER_IMAGE=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Cache build products
        uses: actions/cache@v4
        with:
          path: ~/IvyDerivedData
          key: derived-data-${{ matrix.platform }}-${{ env.RUNNER_IMAGE }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            derived-data-${{ matrix.platform }}-${{ env.RUNNER_IMAGE }}-${{ github.head_ref || github.ref_name }}-
            derived-data-${{ matrix.platform }}-${{ env.RUNNER_IMAGE }}-main-

      - name: Install dependencies
        run: make dependencies

      - name: Check that dependency install left tracked files unchanged
        run: git diff --exit-code

      # The checkout and pod install give every file a new modification
      # time, which would make Xcode rebuild everything despite the cache.
      # Give unchanged files their recorded times back, and let Xcode ignore
      # the new inodes of restored files.
      - name: Make the build cache usable
        run: |
          python3 Scripts/ivy/ci_mtimes.py restore ~/IvyDerivedData/ivy-mtimes.json
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Show prebuilt libraries
        run: |
          ls -la Pods/SignalRingRTC/out/release Pods/SignalRingRTC/out/release/libringrtc
          ls Pods/SignalRingRTC/out/release/WebRTC.xcframework/
          ls Pods/LibMobileCoin/Artifacts/target
          # libsignal downloads its archive during the build when it isn't cached yet.
          ls -la ~/Library/Caches/org.signal.libsignal || true

      - name: Build and test (${{ env.MODE }})
        run: Scripts/ivy/ci-build.sh ${{ matrix.platform }} "$MODE"

      - name: Record file times for the next run
        if: always()
        run: python3 Scripts/ivy/ci_mtimes.py save ~/IvyDerivedData/ivy-mtimes.json

      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-logs
          path: ~/Library/Logs/Ivy-CI
